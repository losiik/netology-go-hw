name: cashcraft

x-db-url: &db-url postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cashapp}?sslmode=disable

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cashapp}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  ledger:
    build:
      context: .
      dockerfile: ledger/Dockerfile
    environment:
      DATABASE_URL: *db-url
      REDIS_ADDR: redis:6379
      LEDGER_GRPC_ADDR: ":9090"
      MIGRATE: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "./ledger", "-health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    environment:
      DATABASE_URL: *db-url
      AUTH_GRPC_ADDR: ":9091"
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env (см. .env.example)}
      JWT_TTL: ${JWT_TTL:-24h}
      MIGRATE: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "./auth", "-health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      LEDGER_ADDR: ledger:9090
      AUTH_ADDR: auth:9091
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env (см. .env.example)}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10s}
    depends_on:
      ledger:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    command: tunnel --no-autoupdate --url http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
